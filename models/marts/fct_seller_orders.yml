version: 2

models:
  - name: fct_seller_orders
    description: >
      One row per order per seller: each seller's share of an order. An order
      with items from several sellers has one row per seller. Built
      incrementally: the first run builds the full table, and later runs only
      process orders purchased at or after the latest order_purchase_at
      already in the table, merging on order_id + seller_id. Rows for older
      orders are not reprocessed, so a change to an old order requires a
      full refresh (dbt build --full-refresh).
    data_tests:
      - unique:
          column_name: "order_id || '-' || seller_id"
    columns:
      - name: order_id
        description: The order. Repeats when the order contains items from several sellers.
        data_tests:
          - not_null
      - name: seller_id
        description: The seller whose items in this order are summarized.
        data_tests:
          - not_null
      - name: order_purchase_at
        description: >
          When the customer placed the order. Used as the incremental filter
          to find new orders since the last run.
        data_tests:
          - not_null
      - name: order_revenue
        description: Sum of the prices of this seller's items in the order. Excludes freight.
      - name: item_count
        description: Number of this seller's items in the order.